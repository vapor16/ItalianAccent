name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install pytest jsonschema pyyaml
      - name: Validate skill, catalog, schemas, profiles, sources and versions
        run: python scripts/validate.py
      - name: Run tests (structural, linguistic, security, behavioral-format)
        run: python -m pytest -q
      - name: Repository statistics
        run: |
          echo "## ItalianAccent knowledge base" >> "$GITHUB_STEP_SUMMARY"
          python scripts/validate.py --stats >> "$GITHUB_STEP_SUMMARY"

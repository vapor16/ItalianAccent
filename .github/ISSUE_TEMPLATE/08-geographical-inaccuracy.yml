name: Report a geographical inaccuracy
description: A form or mode is attributed to the wrong area
labels:
- geography
body:
- type: markdown
  attributes:
    value: Thanks! Please do not paste copyrighted dictionary text; describe facts
      in your own words.
- type: input
  id: mode
  attributes:
    label: Mode id (e.g. wallera, trimone)
    placeholder: wallera
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: What is attributed to the wrong area?
  validations:
    required: true
- type: textarea
  id: correct
  attributes:
    label: Where is it actually used?
  validations:
    required: true
- type: textarea
  id: sources
  attributes:
    label: Sources
    description: Dictionary, book, URL, or 'native speaker usage'. Do not paste copyrighted
      dictionary text.
  validations:
    required: false

name: Report a technical issue
description: Installation, activation, commands, platform problems
labels:
- bug
body:
- type: markdown
  attributes:
    value: Thanks! Please do not paste copyrighted dictionary text; describe facts
      in your own words.
- type: input
  id: platform
  attributes:
    label: Platform and version (Claude Code, Codex, Cursor, Claude.ai…)
  validations:
    required: true
- type: input
  id: install
  attributes:
    label: How did you install ItalianAccent?
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected vs actual behaviour
  validations:
    required: true

name: Add a proverb or idiom
description: Add a traditional proverb, saying or idiom
labels:
- proverbs
body:
- type: markdown
  attributes:
    value: Thanks! Please do not paste copyrighted dictionary text; describe facts
      in your own words.
- type: input
  id: mode
  attributes:
    label: Mode id (e.g. wallera, trimone)
    placeholder: wallera
  validations:
    required: true
- type: textarea
  id: original
  attributes:
    label: Original form
  validations:
    required: true
- type: input
  id: literal
  attributes:
    label: Literal translation
  validations:
    required: true
- type: textarea
  id: meaning
  attributes:
    label: Figurative meaning and when it is used
  validations:
    required: true
- type: input
  id: area
  attributes:
    label: Town / area where this usage is attested
    description: No personal data needed.
  validations:
    required: true
- type: textarea
  id: sources
  attributes:
    label: Sources
    description: Dictionary, book, URL, or 'native speaker usage'. Do not paste copyrighted
      dictionary text.
  validations:
    required: false

name: release-check

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install pytest jsonschema pyyaml
      - name: Full validation and tests
        run: python scripts/validate.py && python -m pytest -q
      - name: Tag matches skill version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - name: Build installable skill ZIP
        run: python scripts/validate.py --zip
      - uses: actions/upload-artifact@v4
        with:
          name: italianaccent-skill-zip
          path: dist/*.zip
          if-no-files-found: error
